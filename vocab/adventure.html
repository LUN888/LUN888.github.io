<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>單字訓練家冒險</title>
<style>
:root{
  --ink:#1f2a44;--muted:#667085;--cream:#fff8df;--sky:#dff4ff;--green:#6fd59b;--green2:#3eaa72;
  --yellow:#ffd75e;--orange:#ff9d4d;--red:#ef5b67;--blue:#4d8dff;--purple:#8667df;--line:#2c3a57;
}
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:#bfe7ff;background-image:linear-gradient(rgba(255,255,255,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.28) 1px,transparent 1px);background-size:24px 24px;min-height:100vh}
body:before{content:"";position:fixed;inset:auto 0 0;height:34vh;background:linear-gradient(#78d68f,#5bbf76);clip-path:polygon(0 36%,14% 22%,28% 34%,46% 11%,62% 30%,76% 18%,100% 38%,100% 100%,0 100%);z-index:-1}
.wrap{width:min(1080px,calc(100% - 20px));margin:auto;padding:18px 0 42px}.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 6px 0 rgba(44,58,87,.22)}
.brand{display:flex;gap:12px;align-items:center}.orb{width:48px;height:48px;border-radius:50%;background:linear-gradient(#62b6ff 0 45%,#fff 45% 55%,#ffd75e 55%);border:3px solid var(--line);position:relative}.orb:after{content:"";position:absolute;width:12px;height:12px;background:#fff;border:3px solid var(--line);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
h1{font-size:clamp(24px,5vw,38px);margin:0;letter-spacing:.03em}.sub{font-size:13px;color:var(--muted);margin-top:3px}.hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{background:var(--cream);border:2px solid var(--line);border-radius:999px;padding:8px 11px;font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}.panel{background:rgba(255,255,255,.95);border:3px solid var(--line);border-radius:20px;box-shadow:0 7px 0 rgba(44,58,87,.2);padding:15px}.panel h2{margin:0 0 10px;font-size:20px}.map{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.route{border:2px solid var(--line);border-radius:16px;padding:12px;background:#f8fbff;cursor:pointer;text-align:left;min-height:106px;transition:.15s}.route:hover{transform:translateY(-2px)}.route.active{box-shadow:0 0 0 3px var(--yellow) inset;background:#fffbe6}.route .icon{font-size:28px}.route b{display:block;margin-top:5px}.route small{color:var(--muted)}
.arena{margin-top:12px;border:3px dashed #67805e;border-radius:22px;padding:18px;background:linear-gradient(#efffe9,#dcf7d5);min-height:410px;display:flex;flex-direction:column;justify-content:space-between}.enemy{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.monster{width:120px;height:120px;border:3px solid var(--line);border-radius:42% 58% 48% 52%;background:linear-gradient(145deg,#ffe074,#ff9e55);display:grid;place-items:center;font-size:56px;box-shadow:0 8px 0 rgba(44,58,87,.16);transform:rotate(-3deg)}.wordbox{flex:1;background:#fff;border:3px solid var(--line);border-radius:16px;padding:14px}.tag{font-size:12px;font-weight:800;color:#fff;background:var(--purple);display:inline-block;padding:4px 8px;border-radius:999px}.prompt{font-size:clamp(24px,5vw,42px);font-weight:900;margin:12px 0 4px}.helper{font-size:13px;color:var(--muted)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.opt{border:3px solid var(--line);border-radius:14px;padding:12px;background:#fff;font:inherit;font-weight:800;cursor:pointer;min-height:54px;text-align:left}.opt:hover{background:#fff9da}.opt.correct{background:#dff8e9;border-color:#23895b}.opt.wrong{background:#ffe4e7;border-color:#c9404d}.opt:disabled{cursor:default}.result{min-height:32px;margin-top:10px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:3px solid var(--line);border-radius:12px;padding:10px 13px;background:#fff;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(44,58,87,.17)}.btn.primary{background:var(--yellow)}.btn.blue{background:#dce9ff}.btn.red{background:#ffe3e6}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(44,58,87,.17)}
.sideStack{display:grid;gap:14px}.starterGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.starter{border:2px solid var(--line);border-radius:14px;background:#fff;padding:10px 6px;text-align:center;cursor:pointer}.starter.active{background:#fff4bd;box-shadow:0 0 0 3px #ffd75e inset}.starter .emoji{font-size:28px}.bar{height:13px;border:2px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#ffd75e,#ff9d4d)}.dex{max-height:230px;overflow:auto;border:2px solid #d8dfeb;border-radius:12px;padding:6px}.dexItem{display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-bottom:1px solid #e7eaf0;font-size:13px}.dexItem:last-child{border-bottom:0}.badgeRow{display:flex;gap:8px;flex-wrap:wrap}.badge{width:42px;height:42px;border:3px solid var(--line);border-radius:50%;display:grid;place-items:center;background:#e9edf3;filter:grayscale(1);opacity:.55}.badge.earned{filter:none;opacity:1;background:#fff2a8}.notice{font-size:12px;color:var(--muted);margin-top:8px}.empty{padding:18px;text-align:center;color:var(--muted)}
@media(max-width:820px){.grid{grid-template-columns:1fr}.map{grid-template-columns:repeat(2,1fr)}.hud{justify-content:flex-start}.topbar{align-items:flex-start;flex-direction:column}.monster{width:90px;height:90px;font-size:44px}.options{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand"><div class="orb"></div><div><h1>單字訓練家冒險</h1><div class="sub">收集單字、挑戰道館、把錯題變成你的圖鑑收藏。</div></div></div>
    <div class="hud"><div class="pill">Lv. <span id="level">1</span></div><div class="pill">EXP <span id="xp">0</span></div><div class="pill">捕捉 <span id="caughtCount">0</span></div><div class="pill">徽章 <span id="badgeCount">0</span></div></div>
  </header>

  <div class="grid">
    <main class="panel">
      <h2>冒險地圖</h2>
      <div class="map">
        <button class="route active" data-mode="wild"><span class="icon">🌿</span><b>草原遭遇</b><small>英文 → 中文</small></button>
        <button class="route" data-mode="reverse"><span class="icon">💧</span><b>湖畔挑戰</b><small>中文 → 英文</small></button>
        <button class="route" data-mode="spell"><span class="icon">⚡</span><b>雷丘陵</b><small>拼字辨識</small></button>
        <button class="route" data-mode="gym"><span class="icon">🏟️</span><b>研究道館</b><small>10 題混合挑戰</small></button>
      </div>

      <section class="arena">
        <div class="enemy">
          <div class="wordbox"><span class="tag" id="modeTag">野生單字</span><div class="prompt" id="prompt">載入中…</div><div class="helper" id="helper">選出正確答案，成功就能累積捕捉進度。</div></div>
          <div class="monster" id="monster">🦊</div>
        </div>
        <div>
          <div class="options" id="options"></div>
          <div class="result" id="result"></div>
          <div class="actions">
            <button class="btn primary" id="nextBtn">下一次遭遇</button>
            <button class="btn blue" id="speakBtn">🔊 發音</button>
            <button class="btn" id="reviewBtn" onclick="location.href='./review.html'">篩選複習</button>
            <button class="btn red" id="wrongBtn" onclick="location.href='./wrong.html'">錯題練習</button>
          </div>
        </div>
      </section>
    </main>

    <aside class="sideStack">
      <section class="panel">
        <h2>選擇夥伴</h2>
        <div class="starterGrid">
          <button class="starter active" data-starter="fox" data-emoji="🦊"><div class="emoji">🦊</div><b>焰狐</b><div class="notice">記憶型</div></button>
          <button class="starter" data-starter="turtle" data-emoji="🐢"><div class="emoji">🐢</div><b>潮龜</b><div class="notice">穩定型</div></button>
          <button class="starter" data-starter="owl" data-emoji="🦉"><div class="emoji">🦉</div><b>葉梟</b><div class="notice">分析型</div></button>
        </div>
        <div class="notice">夥伴只影響外觀，不影響題目難度。</div>
      </section>

      <section class="panel">
        <h2>訓練家經驗值</h2>
        <div class="bar"><div id="xpBar" style="width:0%"></div></div>
        <div class="notice" id="xpText">再獲得 100 EXP 升級</div>
      </section>

      <section class="panel">
        <h2>道館徽章</h2>
        <div class="badgeRow">
          <div class="badge" data-badge="1">🌱</div><div class="badge" data-badge="2">💧</div><div class="badge" data-badge="3">⚡</div><div class="badge" data-badge="4">🔥</div><div class="badge" data-badge="5">⭐</div>
        </div>
        <div class="notice">研究道館 10 題答對 8 題以上可獲得下一枚徽章。</div>
      </section>

      <section class="panel">
        <h2>單字圖鑑</h2>
        <div class="dex" id="dex"><div class="empty">尚未捕捉單字</div></div>
      </section>
    </aside>
  </div>
</div>

<script>
let DATA=null, mode='wild', current=null, answered=false, gym={active:false,n:0,score:0};
const $=id=>document.getElementById(id);
const state=JSON.parse(localStorage.getItem('trainer-state')||'{"xp":0,"caught":{},"badges":0,"starter":"fox"}');
const mastery=JSON.parse(localStorage.getItem('trainer-mastery')||'{}');
function save(){localStorage.setItem('trainer-state',JSON.stringify(state));localStorage.setItem('trainer-mastery',JSON.stringify(mastery))}
function pkey(deck){return `vocab-progress-${deck}`}
function getProgress(deck){return JSON.parse(localStorage.getItem(pkey(deck))||'{}')}
function setProgress(deck,idx,val){const p=getProgress(deck);p[idx]=val;localStorage.setItem(pkey(deck),JSON.stringify(p))}
async function load(){const html=await fetch('./index.html',{cache:'no-store'}).then(r=>r.text());const m=html.match(/const DATA = (\{[\s\S]*?\});\s*let currentDeck/);if(!m)throw Error('找不到單字資料');DATA=JSON.parse(m[1]);setupStarter();renderHUD();nextQuestion()}
function allBasic(){return [...DATA.deck1.map((x,i)=>({...x,deck:'deck1',idx:i})),...DATA.deck2.map((x,i)=>({...x,deck:'deck2',idx:i}))]}
function relationCards(){return DATA.deck3.map((x,i)=>({...x,deck:'deck3',idx:i}))}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeChoices(correct,pool){const vals=[correct];const candidates=shuffle([...new Set(pool.filter(x=>x!==correct))]);for(const c of candidates){if(vals.length>=4)break;vals.push(c)}return shuffle(vals)}
function mutateWord(w){if(w.length<5)return w+'s';const ops=['swap','drop','replace'];const op=pick(ops),a=w.split('');const i=Math.max(1,Math.min(a.length-2,Math.floor(Math.random()*(a.length-2))+1));if(op==='swap'){[a[i],a[i+1]]=[a[i+1],a[i]]}else if(op==='drop'){a.splice(i,1)}else{a[i]=String.fromCharCode(97+Math.floor(Math.random()*26))}return a.join('')}
function buildQuestion(){
 const basic=allBasic(); let qmode=mode==='gym'?pick(['wild','reverse','spell','relation']):mode;
 if(qmode==='relation'){
   const c=pick(relationCards());const ans=(c.back.match(/^[A-Za-z]+/)||[''])[0];const pool=relationCards().map(x=>(x.back.match(/^[A-Za-z]+/)||[''])[0]).filter(Boolean);return {kind:'relation',deck:c.deck,idx:c.idx,prompt:c.front,answer:ans,choices:makeChoices(ans,pool),word:ans,cn:c.back};
 }
 const c=pick(basic);
 if(qmode==='wild')return {kind:'wild',...c,prompt:c.front,answer:c.back,choices:makeChoices(c.back,basic.map(x=>x.back)),word:c.front};
 if(qmode==='reverse')return {kind:'reverse',...c,prompt:c.back,answer:c.front,choices:makeChoices(c.front,basic.map(x=>x.front)),word:c.front};
 const wrongs=[];while(wrongs.length<3){const w=mutateWord(c.front);if(w!==c.front&&!wrongs.includes(w))wrongs.push(w)}return {kind:'spell',...c,prompt:`哪一個是「${c.back}」的正確拼字？`,answer:c.front,choices:shuffle([c.front,...wrongs]),word:c.front};
}
function nextQuestion(){answered=false;current=buildQuestion();$('result').textContent='';$('options').innerHTML='';const labels={wild:['野生單字','看到英文，選中文意思'],reverse:['湖畔挑戰','看到中文，選正確英文'],spell:['雷丘陵','找出正確拼字'],relation:['關聯招式','同義／反義辨識']};$('modeTag').textContent=mode==='gym'?`道館 ${gym.n+1}/10`:labels[current.kind][0];$('prompt').textContent=current.prompt;$('helper').textContent=mode==='gym'?`目前戰績：${gym.score} / ${gym.n}`:labels[current.kind][1];current.choices.forEach(ch=>{const b=document.createElement('button');b.className='opt';b.textContent=ch;b.onclick=()=>answer(ch,b);$('options').appendChild(b)});$('nextBtn').textContent=mode==='gym'?'跳過這題':'下一次遭遇'}
function answer(ch,btn){if(answered)return;answered=true;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===current.answer)b.classList.add('correct')});const ok=ch===current.answer;if(!ok)btn.classList.add('wrong');
 if(ok){$('result').textContent='捕捉成功！ +10 EXP';state.xp+=10;const id=current.deck+':'+current.idx;mastery[id]=(mastery[id]||0)+1;if(current.deck!=='deck3'){state.caught[current.word]=(state.caught[current.word]||0)+1;if(mastery[id]>=2)setProgress(current.deck,current.idx,'known')}if(mode==='gym')gym.score++}
 else{$('result').textContent=`逃走了！正確答案：${current.answer}`;if(current.deck!=='deck3')setProgress(current.deck,current.idx,'missed')}
 if(mode==='gym')gym.n++;save();renderHUD();renderDex();if(mode==='gym'&&gym.n>=10){setTimeout(finishGym,500)} }
function finishGym(){const pass=gym.score>=8;if(pass&&state.badges<5){state.badges++;state.xp+=50;save()}alert(pass?`道館挑戰成功！${gym.score}/10，獲得徽章與 50 EXP。`:`挑戰結果 ${gym.score}/10，需要 8 題以上才能獲得徽章。`);gym={active:true,n:0,score:0};renderHUD();nextQuestion()}
function renderHUD(){const level=Math.floor(state.xp/100)+1,rem=state.xp%100;$('level').textContent=level;$('xp').textContent=state.xp;$('caughtCount').textContent=Object.keys(state.caught).length;$('badgeCount').textContent=state.badges;$('xpBar').style.width=rem+'%';$('xpText').textContent=`再獲得 ${100-rem} EXP 升級`;document.querySelectorAll('.badge').forEach((b,i)=>b.classList.toggle('earned',i<state.badges));renderDex()}
function renderDex(){const entries=Object.entries(state.caught).sort((a,b)=>b[1]-a[1]);$('dex').innerHTML=entries.length?entries.map(([w,n])=>`<div class="dexItem"><b>${w}</b><span>捕捉 ${n} 次</span></div>`).join(''):'<div class="empty">尚未捕捉單字</div>'}
function setupStarter(){const em={fox:'🦊',turtle:'🐢',owl:'🦉'};$('monster').textContent=em[state.starter]||'🦊';document.querySelectorAll('.starter').forEach(s=>s.classList.toggle('active',s.dataset.starter===state.starter))}
document.querySelectorAll('.route').forEach(r=>r.onclick=()=>{mode=r.dataset.mode;document.querySelectorAll('.route').forEach(x=>x.classList.toggle('active',x===r));gym=mode==='gym'?{active:true,n:0,score:0}:{active:false,n:0,score:0};nextQuestion()});
document.querySelectorAll('.starter').forEach(s=>s.onclick=()=>{state.starter=s.dataset.starter;save();setupStarter()});$('nextBtn').onclick=()=>{if(mode==='gym'&&gym.n>=10)return;nextQuestion()};$('speakBtn').onclick=()=>{const w=current?.word;if(!w)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};
load().catch(e=>{$('prompt').textContent='載入失敗';$('helper').textContent=e.message});
</script>
</body>
</html>
