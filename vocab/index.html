<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>學術英文單字卡練習</title>
<meta name="description" content="學術英文單字、中文釋義與同義反義詞互動單字卡練習" />
<style>
:root {
  --bg:#f5f7fb; --panel:#ffffff; --text:#172033; --muted:#64748b;
  --line:#e2e8f0; --primary:#315efb; --primary2:#2548c9;
  --good:#0f9d67; --bad:#d94a4a; --shadow:0 18px 50px rgba(30,41,59,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(180deg,#eef3ff 0,#f8fafc 38%,#f5f7fb 100%);color:var(--text);min-height:100vh}
.wrap{width:min(980px,calc(100% - 28px));margin:0 auto;padding:28px 0 52px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}
h1{font-size:clamp(26px,5vw,42px);margin:0;letter-spacing:-.02em}
.subtitle{margin:8px 0 0;color:var(--muted);font-size:15px}
.small{font-size:13px;color:var(--muted)}
.deck-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.tab{border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:15px;padding:14px 12px;cursor:pointer;text-align:left;transition:.18s}
.tab:hover{transform:translateY(-1px);box-shadow:0 7px 22px rgba(30,41,59,.08)}
.tab.active{border-color:var(--primary);box-shadow:0 0 0 2px rgba(49,94,251,.11);background:#fff}
.tab strong{display:block;font-size:15px;margin-bottom:3px} .tab span{font-size:12px;color:var(--muted)}
.panel{background:rgba(255,255,255,.92);border:1px solid rgba(226,232,240,.9);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px}
.tools-left,.tools-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;padding:9px 12px;cursor:pointer}
.btn:hover{background:#f8fafc} .btn.primary{background:var(--primary);color:white;border-color:var(--primary)} .btn.primary:hover{background:var(--primary2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:19px} .stat span{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#edf2f7;border-radius:99px;overflow:hidden;margin:4px 0 16px}
.progress > div{height:100%;background:linear-gradient(90deg,var(--primary),#7c6df2);width:0;transition:.25s}
.card-wrap{perspective:1200px;min-height:355px}
.card{position:relative;width:100%;min-height:355px;transform-style:preserve-3d;transition:transform .48s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:linear-gradient(145deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 24px}
.back{transform:rotateY(180deg);background:linear-gradient(145deg,#f7f9ff,#fff)}
.kind{position:absolute;top:18px;left:18px;font-size:12px;color:var(--muted);background:#f1f5f9;border-radius:99px;padding:6px 9px}
.card-text{font-size:clamp(28px,6vw,48px);font-weight:760;line-height:1.2;overflow-wrap:anywhere}
.back .card-text{font-size:clamp(26px,5vw,42px)}
.hint{position:absolute;bottom:18px;color:var(--muted);font-size:12px}
.speak{position:absolute;top:15px;right:15px;border:0;background:#edf2ff;color:#244bc6;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rate{border:0;border-radius:14px;padding:13px;font-weight:700;cursor:pointer}
.rate.bad{background:#fff0f0;color:var(--bad)} .rate.good{background:#eafaf3;color:var(--good)}
.nav{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px}
.counter{min-width:95px;text-align:center;color:var(--muted);font-size:14px}
.footer-note{margin-top:16px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:680px){
  .wrap{width:min(100% - 16px,980px);padding-top:16px} header{align-items:flex-start;flex-direction:column}
  .deck-tabs{grid-template-columns:1fr} .panel{padding:12px;border-radius:18px}
  .stats{grid-template-columns:repeat(2,1fr)} .card-wrap,.card{min-height:330px}
  .toolbar{align-items:stretch} .tools-left,.tools-right{width:100%} .tools-right{justify-content:space-between}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>學術英文單字卡</h1>
    <p class="subtitle">三副牌整合練習：英文→中文、剩餘單字、同義／反義強化</p>
  </div>
  <div class="small">進度會自動儲存在這台裝置的瀏覽器</div>
</header>

<div class="deck-tabs" id="deckTabs">
  <button class="tab active" data-deck="deck1"><strong>第一組</strong><span>100 張｜英文 → 中文</span></button>
  <button class="tab" data-deck="deck2"><strong>第二組</strong><span>37 張｜英文 → 中文</span></button>
  <button class="tab" data-deck="deck3"><strong>同義／反義強化</strong><span>68 張｜關聯辨識</span></button>
</div>

<section class="panel">
  <div class="toolbar">
    <div class="tools-left">
      <button class="btn primary" id="shuffleBtn">隨機排序</button>
      <button class="btn" id="resetBtn">重設本副進度</button>
    </div>
    <div class="tools-right">
      <label class="small">顯示順序</label>
      <select class="btn" id="directionSelect">
        <option value="front">正面 → 背面</option>
        <option value="back">背面 → 正面</option>
      </select>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="totalStat">0</b><span>總張數</span></div>
    <div class="stat"><b id="knownStat">0</b><span>會了</span></div>
    <div class="stat"><b id="missedStat">0</b><span>不會</span></div>
    <div class="stat"><b id="remainStat">0</b><span>未標記</span></div>
  </div>
  <div class="progress"><div id="progressBar"></div></div>

  <div class="card-wrap">
    <div class="card" id="card" aria-label="單字卡，點擊翻面">
      <div class="face front">
        <span class="kind" id="frontKind">題目</span>
        <button class="speak" id="speakBtn" title="英文發音">🔊</button>
        <div class="card-text" id="frontText"></div>
        <div class="hint">點卡片查看答案</div>
      </div>
      <div class="face back">
        <span class="kind">答案</span>
        <div class="card-text" id="backText"></div>
        <div class="hint">再點一次翻回正面</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="rate bad" id="missedBtn">× 還不會</button>
    <button class="rate good" id="knownBtn">✓ 會了</button>
  </div>
  <div class="nav">
    <button class="btn" id="prevBtn">← 上一張</button>
    <div class="counter" id="counter"></div>
    <button class="btn" id="nextBtn">下一張 →</button>
  </div>
  <div class="footer-note">提示：按鍵盤空白鍵可翻卡，← / → 可切換，1 = 不會，2 = 會了。</div>
</section>
</div>

"Diagram（圖示／示意圖）"}, {"front": "Maintain 的近義詞？", "back": "Sustain（維持）"}, {"front": "Sustain 的近義詞？", "back": "Maintain（維持）"}, {"front": "Particular 的近義詞？", "back": "Specific（特定的）"}, {"front": "Specific 的近義詞？", "back": "Particular（特定的）"}, {"front": "Prevalent 的近義詞？", "back": "Widespread（普遍／廣泛的）"}, {"front": "Widespread 的近義詞？", "back": "Prevalent（廣泛／普遍的）"}, {"front": "Uncertain 的近義詞？", "back": "Unsure（不確定的）"}, {"front": "Unsure 的近義詞？", "back": "Uncertain（不確定的）"}, {"front": "Contain 的近義詞？", "back": "Encompass（包含／涵蓋）"}, {"front": "Encompass 的近義詞？", "back": "Contain（涵蓋／包含）"}, {"front": "Accomplish 的近義詞？", "back": "Complete（完成）"}, {"front": "Complete 的近義詞？", "back": "Accomplish（完成）"}, {"front": "Active 的反義詞？", "back": "Passive（被動的）"}, {"front": "Passive 的反義詞？", "back": "Active（主動的）"}, {"front": "Bright 的反義詞？", "back": "Dark（黑暗的）"}, {"front": "Dark 的反義詞？", "back": "Bright（明亮的）"}, {"front": "Earlier 的反義詞？", "back": "Later（較晚的）"}, {"front": "Later 的反義詞？", "back": "Earlier（較早的）"}, {"front": "Explicit 的反義詞？", "back": "Implicit（隱含的）"}, {"front": "Implicit 的反義詞？", "back": "Explicit（明確表述的）"}, {"front": "Initial 的反義詞？", "back": "Final（最終的）"}, {"front": "Final 的反義詞？", "back": "Initial（初始的）"}, {"front": "Former 的對比詞？", "back": "Latter（後者）"}, {"front": "Latter 的對比詞？", "back": "Former（前者）"}, {"front": "Global 的反義詞？", "back": "Local（局部的）"}, {"front": "Local 的反義詞？", "back": "Global（全球的）"}, {"front": "Heavy 的反義詞？", "back": "Light（輕的）"}, {"front": "Light 的反義詞？", "back": "Heavy（繁重的）"}, {"front": "Increase 的反義詞？", "back": "Reduce（減少）"}, {"front": "Reduce 的反義詞？", "back": "Increase（增加）"}, {"front": "Loosen 的反義詞？", "back": "Tighten（收緊）"}, {"front": "Tighten 的反義詞？", "back": "Loosen（放鬆）"}, {"front": "Major 的反義詞？", "back": "Minor（次要的）"}, {"front": "Minor 的反義詞？", "back": "Major（主要的）"}, {"front": "Negative 的反義詞？", "back": "Positive（正面的）"}, {"front": "Positive 的反義詞？", "back": "Negative（負面的）"}, {"front": "Often 的反義詞？", "back": "Rarely（很少）"}, {"front": "Rarely 的反義詞？", "back": "Often（經常）"}, {"front": "Permanent 的反義詞？", "back": "Temporary（暫時的）"}, {"front": "Temporary 的反義詞？", "back": "Permanent（永久的）"}, {"front": "Thankful 的反義詞？", "back": "Ungrateful（不感激的）"}, {"front": "Ungrateful 的反義詞？", "back": "Thankful（感激的）"}, {"front": "Thoughtful 的反義詞？", "back": "Inconsiderate（不體貼的）"}, {"front": "Inconsiderate 的反義詞？", "back": "Thoughtful（體貼的）"}, {"front": "Chatty 的反義／對比詞？", "back": "Silent（沉默的）"}, {"front": "Silent 的反義／對比詞？", "back": "Chatty（健談的）"}, {"front": "Hide 的反義／對比詞？", "back": "Expose（揭露）"}, {"front": "Expose 的反義／對比詞？", "back": "Hide（隱藏）"}, {"front": "Support 的反義／對比詞？", "back": "Object（反對）"}, {"front": "Object 的反義／對比詞？", "back": "Support（支持）"}, {"front": "Praise 的反義／對比詞？", "back": "Scold（責罵）"}, {"front": "Scold 的反義／對比詞？", "back": "Praise（稱讚）"}, {"front": "Massive 的反義／對比詞？", "back": "Small（小的）"}, {"front": "Small 的反義／對比詞？", "back": "Massive（大規模的）"}]};
let currentDeck = 'deck1';
let order = [];
let pos = 0;
let flipped = false;
let direction = 'front';

const $ = (id)=>document.getElementById(id);
const card = $('card');
const stateKey = (deck)=>`vocab-progress-${deck}`;
const loadProgress = (deck)=>JSON.parse(localStorage.getItem(stateKey(deck)) || '{}');
const saveProgress = (deck,obj)=>localStorage.setItem(stateKey(deck), JSON.stringify(obj));

function initDeck(deck, preserveOrder=false) {
  currentDeck = deck;
  const n = DATA[deck].length;
  if(!preserveOrder) order = Array.from({length:n},(_,i)=>i);
  pos = 0; flipped = false; card.classList.remove('flipped');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.deck===deck));
  $('directionSelect').value = direction;
  render();
}

function currentCard() {
  return DATA[currentDeck][order[pos]];
}

function displaySides(item) {
  return direction === 'front'
    ? {front:item.front, back:item.back}
    : {front:item.back, back:item.front};
}

function render() {
  const item = currentCard();
  const sides = displaySides(item);
  $('frontText').textContent = sides.front;
  $('backText').textContent = sides.back;
  $('frontKind').textContent = currentDeck==='deck3' ? '關聯題' : (direction==='front' ? '英文' : '中文');
  $('counter').textContent = `${pos+1} / ${order.length}`;
  updateStats();
}

function updateStats() {
  const p = loadProgress(currentDeck);
  let known=0, missed=0;
  for(const v of Object.values(p)) {
    if(v==='known') known++;
    if(v==='missed') missed++;
  }
  const total = DATA[currentDeck].length;
  $('totalStat').textContent=total;
  $('knownStat').textContent=known;
  $('missedStat').textContent=missed;
  $('remainStat').textContent=total-known-missed;
  $('progressBar').style.width = `${((known+missed)/total)*100}%`;
}

function flip() {
  flipped=!flipped;
  card.classList.toggle('flipped',flipped);
}

function move(delta) {
  pos=(pos+delta+order.length)%order.length;
  flipped=false; card.classList.remove('flipped'); render();
}

function rate(value) {
  const p=loadProgress(currentDeck);
  p[order[pos]]=value;
  saveProgress(currentDeck,p);
  updateStats();
  move(1);
}

function shuffle() {
  for(let i=order.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  pos=0; flipped=false; card.classList.remove('flipped'); render();
}

function englishToSpeak(text) {
  const m = text.match(/[A-Za-z]+(?:[ -][A-Za-z]+)*/);
  return m ? m[0] : '';
}

function speak(e) {
  e.stopPropagation();
  const item=currentCard();
  const target = direction==='front' ? item.front : item.back;
  const en=englishToSpeak(target);
  if(!en) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(en);
  u.lang='en-US'; u.rate=.88;
  speechSynthesis.speak(u);
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>initDeck(t.dataset.deck)));
card.addEventListener('click',flip);
$('speakBtn').addEventListener('click',speak);
$('prevBtn').addEventListener('click',()=>move(-1));
$('nextBtn').addEventListener('click',()=>move(1));
$('knownBtn').addEventListener('click',()=>rate('known'));
$('missedBtn').addEventListener('click',()=>rate('missed'));
$('shuffleBtn').addEventListener('click',shuffle);
$('directionSelect').addEventListener('change',(e)=>{direction=e.target.value;flipped=false;card.classList.remove('flipped');render();});
$('resetBtn').addEventListener('click',()=>{
  if(confirm('確定要清除這副牌的會／不會紀錄嗎？')) {
    localStorage.removeItem(stateKey(currentDeck)); updateStats();
  }
});
document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'){e.preventDefault();flip();}
  else if(e.key==='ArrowLeft') move(-1);
  else if(e.key==='ArrowRight') move(1);
  else if(e.key==='1') rate('missed');
  else if(e.key==='2') rate('known');
});
initDeck('deck1');
</script>
</body>
</html>
