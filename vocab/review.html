<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>學術英文｜篩選複習</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#64748b;--line:#e2e8f0;--primary:#315efb;--good:#0f9d67;--bad:#d94a4a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(180deg,#eef3ff,#f8fafc 38%,#f5f7fb);color:var(--text);min-height:100vh}.wrap{width:min(920px,calc(100% - 24px));margin:auto;padding:24px 0 48px}h1{margin:0;font-size:clamp(27px,5vw,40px)}.sub{color:var(--muted);margin:7px 0 18px}.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.control{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font:inherit}.panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 18px 48px rgba(30,41,59,.1)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.stat{text-align:center;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}.card{min-height:350px;border:1px solid var(--line);border-radius:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;cursor:pointer;background:linear-gradient(145deg,#fff,#f8fbff);position:relative}.label{position:absolute;top:16px;left:16px;color:var(--muted);font-size:12px;background:#f1f5f9;padding:6px 9px;border-radius:999px}.text{font-size:clamp(30px,6vw,48px);font-weight:760;line-height:1.2;overflow-wrap:anywhere}.hint{position:absolute;bottom:16px;color:var(--muted);font-size:12px}.speak{position:absolute;top:13px;right:13px;border:0;background:#edf2ff;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.rate{border:0;border-radius:13px;padding:13px;font-weight:700;cursor:pointer}.bad{background:#fff0f0;color:var(--bad)}.good{background:#eafaf3;color:var(--good)}.rate:disabled,button:disabled{opacity:.45;cursor:not-allowed}.nav{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:10px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;cursor:pointer}.counter{min-width:100px;text-align:center;color:var(--muted)}.note{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}.backlink{display:inline-block;margin-top:14px;color:#315efb;text-decoration:none}.statusTag{margin-top:14px;font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.card{min-height:330px}.top>*{flex:1 1 45%}}
</style>
</head>
<body>
<div class="wrap">
<h1>篩選複習</h1>
<p class="sub">只抽你標記過的「會了／不會」，也可以只練還沒標記的單字。</p>
<div class="top">
<select id="deck" class="control"><option value="deck1">第一組｜100 張</option><option value="deck2">第二組｜37 張</option><option value="deck3">同義／反義強化｜68 張</option></select>
<select id="filter" class="control"><option value="all">全部單字</option><option value="missed">只複習不會</option><option value="known">只複習會的</option><option value="unreviewed">只看未標記</option></select>
<select id="direction" class="control"><option value="front">正面 → 背面</option><option value="back">背面 → 正面</option></select>
<button id="shuffle" class="btn">隨機排序</button>
</div>
<section class="panel">
<div class="stats"><div class="stat"><b id="total">0</b><span>總張數</span></div><div class="stat"><b id="known">0</b><span>會了</span></div><div class="stat"><b id="missed">0</b><span>不會</span></div><div class="stat"><b id="unreviewed">0</b><span>未標記</span></div></div>
<div class="card" id="card"><span class="label" id="label">題目</span><button id="speak" class="speak">🔊</button><div class="text" id="text">載入單字中…</div><div class="hint" id="hint">點卡片查看答案</div></div>
<div class="statusTag" id="status"></div>
<div class="actions"><button id="missedBtn" class="rate bad">× 還不會</button><button id="knownBtn" class="rate good">✓ 會了</button></div>
<div class="nav"><button id="prev" class="btn">← 上一張</button><span id="counter" class="counter">0 / 0</span><button id="next" class="btn">下一張 →</button></div>
<div class="note">篩選紀錄與原本單字卡共用。把「不會」改成「會了」後，它會自動離開「只複習不會」清單。</div>
</section>
<a class="backlink" href="./">← 回一般單字卡</a>
</div>
<script>
let DATA=null,deck='deck1',filter='all',direction='front',order=[],pos=0,showBack=false;
const $=id=>document.getElementById(id);const key=d=>`vocab-progress-${d}`;
const progress=d=>JSON.parse(localStorage.getItem(key(d))||'{}');
function save(d,p){localStorage.setItem(key(d),JSON.stringify(p))}
async function loadData(){
  const html=await fetch('./index.html',{cache:'no-store'}).then(r=>r.text());
  const m=html.match(/const DATA = (\{[\s\S]*?\});\s*let currentDeck/);
  if(!m) throw new Error('找不到單字資料');
  DATA=JSON.parse(m[1]); rebuild();
}
function indexes(){const p=progress(deck);return DATA[deck].map((_,i)=>i).filter(i=>{const s=p[i];if(filter==='missed')return s==='missed';if(filter==='known')return s==='known';if(filter==='unreviewed')return !s;return true})}
function rebuild(){order=indexes();pos=0;showBack=false;render()}
function item(){return order.length?DATA[deck][order[pos]]:null}
function sides(x){return direction==='front'?[x.front,x.back]:[x.back,x.front]}
function stats(){const p=progress(deck);let k=0,m=0;Object.values(p).forEach(v=>{if(v==='known')k++;if(v==='missed')m++});$('total').textContent=DATA[deck].length;$('known').textContent=k;$('missed').textContent=m;$('unreviewed').textContent=DATA[deck].length-k-m}
function render(){stats();const x=item(),empty=!x;['missedBtn','knownBtn','prev','next','shuffle'].forEach(id=>$(id).disabled=empty);if(empty){const msg={missed:'目前沒有標記為「不會」的單字',known:'目前沒有標記為「會了」的單字',unreviewed:'目前沒有未標記的單字',all:'目前沒有單字'};$('text').textContent=msg[filter];$('label').textContent='篩選結果';$('hint').textContent='請切換上方篩選條件';$('counter').textContent='0 / 0';$('status').textContent='';return}const[a,b]=sides(x);$('text').textContent=showBack?b:a;$('label').textContent=showBack?'答案':(deck==='deck3'?'關聯題':direction==='front'?'英文':'中文');$('hint').textContent=showBack?'點卡片回到題目':'點卡片查看答案';$('counter').textContent=`${pos+1} / ${order.length}`;const s=progress(deck)[order[pos]];$('status').textContent=s==='known'?'目前標記：✓ 會了':s==='missed'?'目前標記：× 還不會':'目前標記：尚未標記'}
function flip(){if(!order.length)return;showBack=!showBack;render()}
function move(d){if(!order.length)return;pos=(pos+d+order.length)%order.length;showBack=false;render()}
function rate(v){if(!order.length)return;const idx=order[pos],p=progress(deck);p[idx]=v;save(deck,p);if(filter==='all'){move(1);return}const old=pos;order=indexes();pos=order.length?Math.min(old,order.length-1):0;showBack=false;render()}
function shuffle(){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;showBack=false;render()}
function speak(e){e.stopPropagation();const x=item();if(!x)return;const t=(showBack?sides(x)[1]:sides(x)[0]).match(/[A-Za-z]+(?:[ -][A-Za-z]+)*/);if(!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t[0]);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}
$('deck').onchange=e=>{deck=e.target.value;rebuild()};$('filter').onchange=e=>{filter=e.target.value;rebuild()};$('direction').onchange=e=>{direction=e.target.value;showBack=false;render()};$('card').onclick=flip;$('speak').onclick=speak;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('missedBtn').onclick=()=>rate('missed');$('knownBtn').onclick=()=>rate('known');$('shuffle').onclick=shuffle;
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flip()}else if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);else if(e.key==='1')rate('missed');else if(e.key==='2')rate('known')});
loadData().catch(e=>{$('text').textContent='單字資料載入失敗';$('hint').textContent=e.message});
</script>
</body>
</html>
