document.querySelectorAll('.stage').forEach(b=>b.onclick=()=>{document.querySelectorAll('.stage').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.mode').forEach(x=>x.classList.add('hidden'));$(b.dataset.stage).classList.remove('hidden')});
let recPool=[],recPos=0;function startRec(){recPool=filtered($('recScope').value);shuffle(recPool);recPos=0;renderRec()}function renderRec(){if(!recPool.length){$('recFront').textContent='目前沒有符合條件的單字';$('recBack').classList.add('hidden');$('recReveal').disabled=true;$('recCount').textContent='';return}$('recReveal').disabled=false;const x=recPool[recPos];$('recFront').textContent=x.front;$('recBack').textContent=x.back;$('recBack').classList.add('hidden');$('recMiss').classList.add('hidden');$('recKnow').classList.add('hidden');$('recReveal').classList.remove('hidden');$('recCount').textContent=`${recPos+1} / ${recPool.length}`}$('recReveal').onclick=()=>{$('recBack').classList.remove('hidden');$('recReveal').classList.add('hidden');$('recMiss').classList.remove('hidden');$('recKnow').classList.remove('hidden')};function recRate(v){const x=recPool[recPos];mark(x,v);recPos=(recPos+1)%recPool.length;renderRec()}$('recMiss').onclick=()=>recRate('missed');$('recKnow').onclick=()=>recRate('known');$('recShuffle').onclick=startRec;$('recScope').onchange=startRec;
let detTarget=null;function mutate(w){if(w.length<4)return w+'x';let a=w.split(''),t=Math.floor(Math.random()*4);if(t===0)a.splice(1+Math.floor(Math.random()*(a.length-2)),1);else if(t===1){let i=1+Math.floor(Math.random()*(a.length-2));a.splice(i,0,a[i])}else if(t===2){let i=1+Math.floor(Math.random()*(a.length-2));[a[i],a[i+1]]=[a[i+1],a[i]]}else{let i=1+Math.floor(Math.random()*(a.length-2));a[i]=a[i].toLowerCase()==='a'?'e':'a'}let s=a.join('');return s.toLowerCase()===w.toLowerCase()?w+'x':s}function newDetect(){if(!all.length)return;let base=filtered($('detScope')?.value||'all');if(!base.length)base=[...all];detTarget=rnd(base);let choices=[{text:mutate(detTarget.front),bad:true}];shuffle(all.filter(x=>x.front!==detTarget.front)).slice(0,7).forEach(x=>choices.push({text:x.front,bad:false}));shuffle(choices);$('detGrid').innerHTML='';$('detFeedback').textContent='';choices.forEach(c=>{const b=document.createElement('button');b.className='wordbtn';b.textContent=c.text;b.onclick=()=>{document.querySelectorAll('#detGrid .wordbtn').forEach(z=>z.disabled=true);if(c.bad){b.classList.add('correct');mark(detTarget,'known');$('detFeedback').textContent=`答對：${c.text} → ${detTarget.front}`;$('detFeedback').className='feedback ok'}else{b.classList.add('wrong');mark(detTarget,'missed');const bad=choices.find(q=>q.bad).text;$('detFeedback').textContent=`這個字本身沒錯；真正拼錯的是 ${bad}，正確應為 ${detTarget.front}`;$('detFeedback').className='feedback no'}};$('detGrid').appendChild(b)})}$('detScope').onchange=newDetect;$('detNextTop').onclick=newDetect;
let spellTarget=null,spellDone=false;function newSpell(){if(!all.length)return;let base=filtered($('spellScope')?.value||'all');if(!base.length)base=[...all];spellTarget=rnd(base);spellDone=false;$('spellMeaning').textContent=spellTarget.back;$('spellInput').value='';$('spellInput').disabled=false;$('spellSubmit').disabled=false;$('spellFeedback').textContent='';$('spellNext').classList.add('hidden');setTimeout(()=>$('spellInput').focus(),50)}function checkSpell(){if(spellDone||!spellTarget)return;const v=$('spellInput').value.trim();if(!v)return;spellDone=true;const ok=v.toLowerCase()===spellTarget.front.toLowerCase();$('spellInput').disabled=true;$('spellSubmit').disabled=true;$('spellNext').classList.remove('hidden');if(ok){mark(spellTarget,'known');$('spellFeedback').textContent=`✓ ${spellTarget.front}`;$('spellFeedback').className='feedback ok'}else{mark(spellTarget,'missed');$('spellFeedback').textContent=`✗ 正確拼字：${spellTarget.front}；你輸入：${v}`;$('spellFeedback').className='feedback no'}}$('spellSubmit').onclick=checkSpell;$('spellNext').onclick=newSpell;$('spellNextTop').onclick=newSpell;$('spellScope').onchange=newSpell;$('spellInput').onkeydown=e=>{if(e.key==='Enter')spellDone?newSpell():checkSpell()};
function groupOf(w){return CONFLICTS.filter(g=>g.includes(w)).flat()}function sameMeaning(a,b){const A=all.find(x=>x.front===a),B=all.find(x=>x.front===b);return A&&B&&A.back===B.back}function sim(a,b){a=a.toLowerCase();b=b.toLowerCase();let s=0;if(a[0]===b[0])s+=2;if(a.slice(-2)===b.slice(-2))s+=2;s+=Math.max(0,4-Math.abs(a.length-b.length));return s}function getQueue(){let q=JSON.parse(localStorage.getItem('clozeQueueV2')||'[]');if(!q.length)q=shuffle(CLOZE.map(x=>x.w));return q}function saveQueue(q){localStorage.setItem('clozeQueueV2',JSON.stringify(q))}function coverage(q){$('clozeCoverage').textContent=`本輪已覆蓋 ${137-q.length} / 137 個目標字（跑完整輪前不重複）`}let currentTargets=[],currentBank=[];
function newCloze(){let q=getQueue();if(q.length<5)q=shuffle(CLOZE.map(x=>x.w));currentTargets=q.splice(0,5);saveQueue(q);coverage(q);const forbidden=new Set(currentTargets);currentTargets.forEach(w=>groupOf(w).forEach(x=>forbidden.add(x)));let candidates=CLOZE.filter(x=>!forbidden.has(x.w)&&!currentTargets.some(t=>sameMeaning(t,x.w)));const targetPos=currentTargets.map(w=>cmap.get(w).p);candidates.forEach(x=>x._score=(targetPos.includes(x.p)?5:0)+Math.max(...currentTargets.map(t=>sim(t,x.w)))+Math.random()*2);candidates.sort((a,b)=>b._score-a._score);const distract=candidates.slice(0,3).map(x=>x.w);currentBank=shuffle([...currentTargets,...distract]);$('wordBank').innerHTML=currentBank.map(w=>`<span>${w.toLowerCase()}</span>`).join('');$('clozeList').innerHTML='';currentTargets.forEach((w,i)=>{const item=cmap.get(w),d=document.createElement('div');d.className='cloze-item';d.innerHTML=`<div><b>${i+1}.</b> ${item.s}</div><select class="control"><option value="">— 選擇答案 —</option>${currentBank.map(x=>`<option value="${x}">${x.toLowerCase()}</option>`).join('')}</select><div class="muted ansline"></div>`;$('clozeList').appendChild(d)});$('clozeResult').classList.add('hidden');$('clozeResult').innerHTML=''}
function submitCloze(){let right=0;document.querySelectorAll('.cloze-item').forEach((d,i)=>{const v=d.querySelector('select').value,a=currentTargets[i],line=d.querySelector('.ansline'),x=all.find(z=>z.front===a);if(v===a){right++;line.textContent='✓ 正確';if(x)mark(x,'known')}else{line.textContent=`✗ 正確答案：${a}`;if(x)mark(x,'missed')}});$('clozeResult').classList.remove('hidden');$('clozeResult').innerHTML=`本組答對 <b>${right} / 5</b>。此模式已排除可能造成同義雙解的選項組合。`}$('newCloze').onclick=newCloze;$('submitCloze').onclick=submitCloze;$('resetClozeCycle').onclick=()=>{localStorage.removeItem('clozeQueueV2');newCloze()};
