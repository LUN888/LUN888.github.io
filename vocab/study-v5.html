<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學術英文四階段訓練</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#eef7ff}</style></head><body><iframe id="app" src="./study-v3.html"></iframe><script>
const PRIMARY=["Abundance","Accomplish","Acquisition","Active","Aforementioned","Aforesaid","Appraisal","Assessment","Assumption","Attainment","Boring","Classification","Clear","Complete","Comprehension","Concentrate","Constraint","Contain","Current","Diagram","Distribute","Educational","Emphasize","Encompass","Essential","Evidence","Exclude","Explicit","Final","Former","General","Global","Harmful","Hypothesis","Ignore","Illustration","Implicit","Increase","Initial","Insight","Iterative","Lack","Latter","Limitations","Major","Manipulate","Negative","Operate","Particular","Passive","Pedagogical","Peer","Perception","Positive","Possess","Praise","Pressure","Prevalent","Quality","Quantity","Rarely","Reduce","Repeated","Share","Significant","Small","Specific","Substantial","Support","Temporary","Traditional","Uncertain","Useful","Variable","Various","Verification","Widespread"];
const frame=document.getElementById('app');
function patch(){try{const d=frame.contentDocument,w=frame.contentWindow;if(!d||!d.getElementById('cloze')||typeof w.newCloze!=='function'){setTimeout(patch,180);return}if(d.documentElement.dataset.v5==='1')return;d.documentElement.dataset.v5='1';const desc=d.querySelector('#cloze .muted');if(desc)desc.textContent='5 個空格共用 8 個選項；題目優先直接取自教授論文原句挖空或只做極小幅修改，選項多於題目，而且每題只允許一個合理答案。';const footer=d.querySelector('.footer');if(footer)footer.textContent='克漏字會輪替整個 137 字庫；優先使用論文原句直接挖空或極小幅修改，只有找不到合適原句時才使用較多局部改寫，並排除可能造成雙解的近義選項。';const s=d.createElement('script');s.textContent=`(()=>{const PRIMARY=new Set(${JSON.stringify(PRIMARY)});getQueue=function(){let q=JSON.parse(localStorage.getItem('clozeQueueV5')||'[]');if(!q.length){const a=shuffle(CLOZE.filter(x=>PRIMARY.has(x.w)).map(x=>x.w));const b=shuffle(CLOZE.filter(x=>!PRIMARY.has(x.w)).map(x=>x.w));q=[...a,...b]}return q};saveQueue=function(q){localStorage.setItem('clozeQueueV5',JSON.stringify(q))};newCloze=function(){let q=getQueue();if(q.length<5){localStorage.removeItem('clozeQueueV5');q=getQueue()}currentTargets=q.splice(0,5);saveQueue(q);coverage(q);const forbidden=new Set(currentTargets);currentTargets.forEach(v=>groupOf(v).forEach(x=>forbidden.add(x)));let candidates=CLOZE.filter(x=>!forbidden.has(x.w)&&!currentTargets.some(t=>sameMeaning(t,x.w)));const targetPos=currentTargets.map(v=>cmap.get(v).p);candidates.forEach(x=>x._score=(targetPos.includes(x.p)?5:0)+Math.max(...currentTargets.map(t=>sim(t,x.w)))+Math.random()*2);candidates.sort((a,b)=>b._score-a._score);const distract=candidates.slice(0,3).map(x=>x.w);currentBank=shuffle([...currentTargets,...distract]);$('wordBank').innerHTML=currentBank.map(v=>'<span>'+v.toLowerCase()+'</span>').join('');$('clozeList').innerHTML='';currentTargets.forEach((v,i)=>{const item=cmap.get(v),el=document.createElement('div');el.className='cloze-item';el.innerHTML='<div><b>'+(i+1)+'.</b> '+item.s+'</div><select class="control"><option value="">— 選擇答案 —</option>'+currentBank.map(x=>'<option value="'+x+'">'+x.toLowerCase()+'</option>').join('')+'</select><div class="muted ansline"></div>';$('clozeList').appendChild(el)});$('clozeResult').classList.add('hidden');$('clozeResult').innerHTML=''};$('newCloze').onclick=newCloze;$('resetClozeCycle').onclick=()=>{localStorage.removeItem('clozeQueueV5');newCloze()};localStorage.removeItem('clozeQueueV5');newCloze()})();`;d.body.appendChild(s)}catch(e){setTimeout(patch,250)}}frame.addEventListener('load',()=>setTimeout(patch,250));setTimeout(patch,800);
</script></body></html>
