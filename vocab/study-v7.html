<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學術英文四階段訓練 V7</title>
</head>
<body>
<div style="font-family:system-ui;padding:24px">正在載入鍵盤版學術英文訓練…</div>
<script>
(async()=>{
  try{
    let src=await fetch('./study-v6.html?v7kb=20261104',{cache:'no-store'}).then(r=>r.text());

    const kbScript=`<script>(function(){
      function hidden(el){return !el || el.classList.contains('hidden') || getComputedStyle(el).display==='none' || getComputedStyle(el).visibility==='hidden';}
      function isTyping(doc){
        const a=doc.activeElement;
        return !!(a && (a.matches('input,textarea,select') || a.isContentEditable));
      }
      function innerDoc(){
        const f=document.getElementById('app');
        if(!f)return null;
        try{
          const d=f.contentDocument;
          if(d && d.getElementById('recReveal'))return d;
        }catch(e){}
        return null;
      }
      function runKey(key){
        const d=innerDoc();
        if(!d || isTyping(d))return false;
        const mode=d.getElementById('recognition');
        if(!mode || mode.classList.contains('hidden'))return false;
        const reveal=d.getElementById('recReveal');
        const miss=d.getElementById('recMiss');
        const know=d.getElementById('recKnow');
        if(key==='Enter'){
          if(reveal && !hidden(reveal) && !reveal.disabled){reveal.click();return true;}
          return false;
        }
        if(key==='ArrowLeft'){
          if(miss && !hidden(miss) && !miss.disabled){miss.click();return true;}
          return false;
        }
        if(key==='ArrowRight'){
          if(know && !hidden(know) && !know.disabled){know.click();return true;}
          return false;
        }
        return false;
      }
      function handler(e){
        if(runKey(e.key)){
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      }
      function install(){
        const d=innerDoc();
        if(!d)return;
        if(!d.documentElement.dataset.stage1Kb){
          d.documentElement.dataset.stage1Kb='1';
          d.addEventListener('keydown',handler,true);
          try{d.defaultView.addEventListener('keydown',handler,true);}catch(e){}
        }
        const f=document.getElementById('app');
        if(f && !f.dataset.stage1KbFocus){
          f.dataset.stage1KbFocus='1';
          try{f.contentWindow.focus();}catch(e){}
        }
      }
      document.addEventListener('keydown',handler,true);
      window.addEventListener('keydown',handler,true);
      const f=document.getElementById('app');
      if(f)f.addEventListener('load',()=>{setTimeout(install,100);setTimeout(install,500);setTimeout(install,1200);});
      setInterval(install,300);

      const hint=document.createElement('div');
      hint.textContent='Enter 顯示中文　← 不會　→ 會了';
      hint.style.cssText='position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:99999;background:rgba(31,42,68,.94);color:#fff;padding:8px 15px;border-radius:999px;font:700 14px Microsoft JhengHei,system-ui,sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.2);pointer-events:none;white-space:nowrap';
      document.body.appendChild(hint);
    })();<\/script>`;

    const needle='document.open();document.write(h);document.close();';
    const replacement=`h=h.replace('</body>',${JSON.stringify(kbScript)}+'</body>');document.open();document.write(h);document.close();`;
    if(!src.includes(needle))throw new Error('找不到 V6 最終載入位置');
    src=src.replace(needle,replacement);
    document.open();
    document.write(src);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="font-family:system-ui;padding:24px"><h2>載入失敗</h2><p>'+e.message+'</p></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
