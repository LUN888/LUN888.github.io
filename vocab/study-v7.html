<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學術英文四階段訓練 V7</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff3ff}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}
#kbHint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:99999;background:rgba(25,35,58,.94);color:#fff;padding:8px 15px;border-radius:999px;font:700 14px "Microsoft JhengHei",system-ui,sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.2);pointer-events:none;white-space:nowrap}
@media(max-width:600px){#kbHint{font-size:12px;padding:7px 10px}}
</style>
</head>
<body>
<iframe id="app" src="./study-v7-core.html" title="學術英文四階段訓練"></iframe>
<div id="kbHint">第一階段快捷鍵：Enter 顯示中文　← 不會　→ 會</div>
<script>
(function(){
  function isTyping(doc){
    const a=doc.activeElement;
    return !!(a && (a.matches?.('input, textarea, select') || a.isContentEditable));
  }

  function visible(el){
    if(!el) return false;
    const win=el.ownerDocument.defaultView;
    const s=win.getComputedStyle(el);
    return s.display!=='none' && s.visibility!=='hidden' && !el.classList.contains('hidden');
  }

  function childDocs(doc){
    const out=[];
    try{
      doc.querySelectorAll('iframe').forEach(f=>{
        try{if(f.contentDocument)out.push(f.contentDocument)}catch(e){}
      });
    }catch(e){}
    return out;
  }

  function allDocs(){
    const seen=new Set(), list=[];
    function walk(doc){
      if(!doc||seen.has(doc))return;
      seen.add(doc);list.push(doc);
      childDocs(doc).forEach(walk);
    }
    walk(document);
    return list;
  }

  function targetDoc(){
    return allDocs().find(d=>d.getElementById('recReveal')&&d.getElementById('recognition'))||null;
  }

  function perform(e){
    const doc=targetDoc();
    if(!doc) return;
    if(isTyping(doc)) return;

    const mode=doc.getElementById('recognition');
    if(!mode || mode.classList.contains('hidden')) return;

    const reveal=doc.getElementById('recReveal');
    const miss=doc.getElementById('recMiss');
    const know=doc.getElementById('recKnow');

    if(e.key==='Enter' && visible(reveal) && !reveal.disabled){
      e.preventDefault(); e.stopPropagation(); reveal.click(); return;
    }
    if(e.key==='ArrowLeft' && visible(miss) && !miss.disabled){
      e.preventDefault(); e.stopPropagation(); miss.click(); return;
    }
    if(e.key==='ArrowRight' && visible(know) && !know.disabled){
      e.preventDefault(); e.stopPropagation(); know.click(); return;
    }
  }

  function installEverywhere(){
    allDocs().forEach(doc=>{
      if(doc.__stage1KeysV7)return;
      doc.__stage1KeysV7=true;
      doc.addEventListener('keydown',perform,true);
      try{doc.defaultView.addEventListener('keydown',perform,true)}catch(e){}
    });
  }

  document.addEventListener('keydown',perform,true);
  setInterval(installEverywhere,250);

  // 載入後把焦點送進最深層學習頁；即使沒點滑鼠也能直接按鍵
  setTimeout(function focusDeep(){
    const doc=targetDoc();
    if(doc){
      try{doc.defaultView.focus()}catch(e){}
      try{doc.body.tabIndex=-1;doc.body.focus({preventScroll:true})}catch(e){}
    }else setTimeout(focusDeep,300);
  },500);
})();
</script>
</body>
</html>
