<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學術英文四階段訓練 V7</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff3ff}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}
#kbHint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:99999;background:rgba(25,35,58,.94);color:#fff;padding:8px 15px;border-radius:999px;font:700 14px "Microsoft JhengHei",system-ui,sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.2);pointer-events:none;white-space:nowrap}
@media(max-width:600px){#kbHint{font-size:12px;padding:7px 10px}}
</style>
</head>
<body>
<iframe id="app" src="./study-v7-core.html" title="學術英文四階段訓練"></iframe>
<div id="kbHint">第一階段快捷鍵：Enter 顯示中文　← 不會　→ 會</div>
<script>
(function(){
  const frame=document.getElementById('app');

  function inner(){
    try{
      const doc=frame.contentDocument;
      const win=frame.contentWindow;
      if(!doc||!win||!doc.getElementById('recReveal')) return null;
      return {doc,win};
    }catch(e){return null;}
  }

  function visible(el){
    if(!el) return false;
    const s=el.ownerDocument.defaultView.getComputedStyle(el);
    return s.display!=='none' && s.visibility!=='hidden' && !el.classList.contains('hidden');
  }

  function isTyping(doc){
    const a=doc.activeElement;
    return !!(a && (a.matches('input, textarea, select') || a.isContentEditable));
  }

  function perform(e){
    const x=inner();
    if(!x) return;
    const doc=x.doc;
    if(isTyping(doc)) return;

    const mode=doc.getElementById('recognition');
    if(!mode || mode.classList.contains('hidden')) return;

    const reveal=doc.getElementById('recReveal');
    const miss=doc.getElementById('recMiss');
    const know=doc.getElementById('recKnow');

    if(e.key==='Enter' && visible(reveal) && !reveal.disabled){
      e.preventDefault();
      e.stopPropagation();
      reveal.click();
      return;
    }
    if(e.key==='ArrowLeft' && visible(miss) && !miss.disabled){
      e.preventDefault();
      e.stopPropagation();
      miss.click();
      return;
    }
    if(e.key==='ArrowRight' && visible(know) && !know.disabled){
      e.preventDefault();
      e.stopPropagation();
      know.click();
    }
  }

  function installInner(){
    const x=inner();
    if(!x) return;
    const doc=x.doc;
    if(doc.__stage1KeyboardInstalled) return;
    doc.__stage1KeyboardInstalled=true;
    doc.addEventListener('keydown',perform,true);
    try{x.win.focus();}catch(e){}
  }

  // 外層有焦點時也能使用快捷鍵
  document.addEventListener('keydown',perform,true);

  // 內層頁面有焦點時也能使用快捷鍵
  frame.addEventListener('load',function(){
    setTimeout(installInner,100);
    setTimeout(installInner,500);
    setTimeout(installInner,1200);
    setTimeout(function(){try{frame.contentWindow.focus();}catch(e){}},1400);
  });

  // 內頁會經過數次 document.write，持續重新確認最終頁面
  setInterval(installInner,300);
})();
</script>
</body>
</html>
