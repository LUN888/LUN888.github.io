 if(isTyping())return;
 var reveal=revealButton();
 var miss=missButton();
 var known=knownButton();
 var stageOne=!!reveal||!!(miss&&known);
 if(!stageOne)return;
 if(e.key==='Enter'){
   if(reveal){e.preventDefault();reveal.click()}
 }else if(e.key==='ArrowLeft'){
   if(miss){e.preventDefault();miss.click()}
 }else if(e.key==='ArrowRight'){
   if(known){e.preventDefault();known.click()}
 }
});

document.body.appendChild(hint);
