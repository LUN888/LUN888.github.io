<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學術英文四階段訓練</title><style>
:root{--ink:#1f2a44;--muted:#68738a;--line:#2c3a57;--blue:#5ba8ff;--yellow:#ffd65c;--green:#69d59b;--red:#ef6a75;--cream:#fff9df;--panel:#fff}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#cceeff,#edf8ff 40%,#dff6da);min-height:100vh}.wrap{width:min(1100px,calc(100% - 20px));margin:auto;padding:18px 0 40px}.hero,.panel{background:#fff;border:3px solid var(--line);border-radius:20px;box-shadow:0 7px 0 rgba(44,58,87,.17)}.hero{padding:16px;display:flex;gap:12px;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.ball{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);background:linear-gradient(#69b8ff 0 45%,#fff 45% 55%,#ffd65c 55%);position:relative}.ball:after{content:"";position:absolute;width:13px;height:13px;border:3px solid var(--line);border-radius:50%;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}h1{margin:0;font-size:clamp(25px,5vw,40px)}.sub{font-size:13px;color:var(--muted);margin-top:4px}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{border:2px solid var(--line);border-radius:999px;background:var(--cream);padding:8px 10px;font-weight:800;font-size:13px}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stage{border:3px solid var(--line);border-radius:16px;background:#fff;padding:12px;text-align:left;cursor:pointer;box-shadow:0 4px 0 rgba(44,58,87,.14)}.stage.active{background:#fff3b3;transform:translateY(1px)}.stage b{display:block;margin-top:5px}.stage small{color:var(--muted)}.panel{padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.control,.btn,.input{font:inherit;border:2px solid var(--line);border-radius:11px;background:#fff;padding:10px 12px}.btn{font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(44,58,87,.13)}.btn.primary{background:var(--yellow)}.btn.good{background:#dcf6e7}.btn.bad{background:#ffe4e7}.btn:disabled{opacity:.45}.card{border:3px dashed #6f8a67;border-radius:20px;background:linear-gradient(#f3ffed,#e0f6d8);min-height:360px;padding:20px;display:flex;flex-direction:column;justify-content:center}.center{text-align:center}.tag{display:inline-block;border-radius:999px;padding:5px 9px;background:#8065d6;color:white;font-weight:800;font-size:12px}.big{font-size:clamp(32px,7vw,54px);font-weight:900;margin:16px 0}.answer{font-size:clamp(24px,5vw,38px);font-weight:900;margin:12px 0}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}.wordgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.wordbtn{border:3px solid var(--line);border-radius:13px;background:#fff;padding:12px 8px;font-weight:800;cursor:pointer}.wordbtn.correct{background:#ddf7e8}.wordbtn.wrong{background:#ffe3e7}.spellrow{display:flex;gap:8px;max-width:650px;margin:16px auto 0}.spellrow .input{flex:1;font-size:22px;font-weight:800}.feedback{min-height:58px;margin-top:12px;font-weight:800;text-align:center}.feedback.ok{color:#17774e}.feedback.no{color:#b72e3d}.bank{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.bank span{border:2px solid var(--line);border-radius:999px;background:#fff8cf;padding:7px 10px;font-weight:800}.cloze-list{display:grid;gap:12px}.cloze-item{border:2px solid #dbe2ed;border-radius:14px;padding:12px;background:#fbfcff}.cloze-item select{margin-top:8px;width:100%}.resultbox{margin-top:12px;border-radius:12px;padding:10px;background:#f7f9fc}.hidden{display:none}.footer{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}.statusline{margin-top:8px;text-align:center;font-size:13px;color:var(--muted)}@media(max-width:760px){.stages{grid-template-columns:1fr 1fr}.wordgrid{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;flex-direction:column}.hud{justify-content:flex-start}.spellrow{flex-direction:column}}
</style></head><body><div class="wrap">
<div class="hero"><div class="brand"><div class="ball"></div><div><h1>學術英文四階段訓練</h1><div class="sub">英→中反射 → 拼字找錯 → 完整拼字 → 教授型克漏字</div></div></div><div class="hud"><span class="pill" id="knownHud">會了 0</span><span class="pill" id="missedHud">錯題 0</span><span class="pill" id="totalHud">共 137 字</span></div></div>
<div class="stages">
<button class="stage active" data-stage="recognition">① 🧠<b>英→中反射</b><small>看到英文立刻知道中文</small></button>
<button class="stage" data-stage="detect">② 🔎<b>拼字找錯</b><small>8 個字中找出拼錯者</small></button>
<button class="stage" data-stage="spelling">③ ✍️<b>完整拼字</b><small>只看中文，自己輸入英文</small></button>
<button class="stage" data-stage="cloze">④ 🏟️<b>教授型克漏字</b><small>5 空格共用 8 個選項</small></button>
</div>
<section class="panel">
<div id="recognition" class="mode"><div class="toolbar"><select id="recScope" class="control"><option value="all">全部 137 字</option><option value="missed">只練錯題</option><option value="unreviewed">只看未標記</option></select><button id="recShuffle" class="btn">隨機</button></div><div class="card center"><span class="tag">第一階段</span><div class="big" id="recFront">載入中…</div><div id="recBack" class="answer hidden"></div><div class="actions"><button id="recReveal" class="btn primary">顯示中文</button><button id="recMiss" class="btn bad hidden">× 不會</button><button id="recKnow" class="btn good hidden">✓ 會了</button></div><div class="statusline" id="recCount"></div></div></div>
<div id="detect" class="mode hidden"><div class="toolbar"><select id="detScope" class="control"><option value="all">全部 137 字</option><option value="missed">只練錯題</option></select><button id="detNextTop" class="btn">換一題</button></div><div class="card center"><span class="tag">第二階段</span><div class="answer">下面 8 個英文單字，只有 1 個拼錯</div><div class="wordgrid" id="detGrid"></div><div class="feedback" id="detFeedback"></div><div class="statusline">答錯的單字會自動回到錯題池</div></div></div>
<div id="spelling" class="mode hidden"><div class="toolbar"><select id="spellScope" class="control"><option value="all">全部 137 字</option><option value="missed">只練錯題</option></select><button id="spellNextTop" class="btn">換一題</button></div><div class="card center"><span class="tag">第三階段</span><div class="muted">請輸入這個中文意思對應的完整英文</div><div class="big" id="spellMeaning"></div><div class="spellrow"><input id="spellInput" class="input" autocomplete="off" spellcheck="false" placeholder="Type the English word"><button id="spellSubmit" class="btn primary">確認</button></div><div class="feedback" id="spellFeedback"></div><div class="actions"><button id="spellNext" class="btn hidden">下一題 →</button></div></div></div>
<div id="cloze" class="mode hidden"><div class="toolbar"><button id="newCloze" class="btn primary">換一組新題</button></div><div class="card"><div class="center"><span class="tag">第四階段</span><div class="answer">教授型克漏字</div><div class="muted">5 個空格共用 8 個選項；一定有多餘選項，干擾詞也會故意很像。</div></div><div class="bank" id="wordBank"></div><div class="cloze-list" id="clozeList"></div><div class="actions"><button id="submitCloze" class="btn primary">交卷</button></div><div id="clozeResult" class="resultbox hidden"></div></div></div>
<div class="footer">四個階段共用同一份瀏覽器學習紀錄；答錯會加入錯題，答對可改回會了。</div>
</section></div>
<script>
let DATA=null,all=[],stage='recognition';const $=id=>document.getElementById(id);const pkey=d=>`vocab-progress-${d}`;const gp=d=>JSON.parse(localStorage.getItem(pkey(d))||'{}');const sp=(d,p)=>localStorage.setItem(pkey(d),JSON.stringify(p));
async function load(){const h=await fetch('./index.html',{cache:'no-store'}).then(r=>r.text());const m=h.match(/const DATA = (\{[\s\S]*?\});\s*let currentDeck/);if(!m)throw Error('找不到單字資料');DATA=JSON.parse(m[1]);DATA.deck1.forEach((x,i)=>all.push({...x,deck:'deck1',idx:i}));DATA.deck2.forEach((x,i)=>all.push({...x,deck:'deck2',idx:i}));updateHud();startRec();newDetect();newSpell();newCloze();}
function state(x){return gp(x.deck)[x.idx]}function mark(x,v){const p=gp(x.deck);p[x.idx]=v;sp(x.deck,p);updateHud()}function updateHud(){let k=0,m=0;all.forEach(x=>{const s=state(x);if(s==='known')k++;if(s==='missed')m++});$('knownHud').textContent=`會了 ${k}`;$('missedHud').textContent=`錯題 ${m}`;$('totalHud').textContent=`共 ${all.length||137} 字`}
function filtered(scope){if(scope==='missed')return all.filter(x=>state(x)==='missed');if(scope==='unreviewed')return all.filter(x=>!state(x));return [...all]}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
document.querySelectorAll('.stage').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;document.querySelectorAll('.stage').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.mode').forEach(x=>x.classList.add('hidden'));$(stage).classList.remove('hidden')});
let recPool=[],recPos=0,recShown=false;function startRec(){recPool=filtered($('recScope').value);shuffle(recPool);recPos=0;renderRec()}function renderRec(){if(!recPool.length){$('recFront').textContent='目前沒有符合條件的單字';$('recBack').classList.add('hidden');$('recReveal').disabled=true;$('recCount').textContent='';return}$('recReveal').disabled=false;recShown=false;const x=recPool[recPos];$('recFront').textContent=x.front;$('recBack').textContent=x.back;$('recBack').classList.add('hidden');$('recMiss').classList.add('hidden');$('recKnow').classList.add('hidden');$('recReveal').classList.remove('hidden');$('recCount').textContent=`${recPos+1} / ${recPool.length}`}
$('recReveal').onclick=()=>{$('recBack').classList.remove('hidden');$('recReveal').classList.add('hidden');$('recMiss').classList.remove('hidden');$('recKnow').classList.remove('hidden')};function recRate(v){const x=recPool[recPos];mark(x,v);recPos=(recPos+1)%recPool.length;renderRec()}$('recMiss').onclick=()=>recRate('missed');$('recKnow').onclick=()=>recRate('known');$('recShuffle').onclick=startRec;$('recScope').onchange=startRec;
let detTarget=null;function mutate(w){if(w.length<4)return w+'x';let a=w.split(''),t=Math.floor(Math.random()*4);if(t===0){a.splice(1+Math.floor(Math.random()*(a.length-2)),1)}else if(t===1){let i=1+Math.floor(Math.random()*(a.length-2));a.splice(i,0,a[i])}else if(t===2){let i=1+Math.floor(Math.random()*(a.length-2));[a[i],a[i+1]]=[a[i+1],a[i]]}else{let i=1+Math.floor(Math.random()*(a.length-2));a[i]=a[i].toLowerCase()==='a'?'e':'a'}let s=a.join('');return s.toLowerCase()===w.toLowerCase()?w+'x':s}
function newDetect(){if(!all.length)return;let base=filtered($('detScope')?.value||'all');if(!base.length)base=[...all];detTarget=rnd(base);let choices=[{text:mutate(detTarget.front),bad:true,x:detTarget}];let others=shuffle(all.filter(x=>x.front!==detTarget.front)).slice(0,7);others.forEach(x=>choices.push({text:x.front,bad:false,x}));shuffle(choices);$('detGrid').innerHTML='';$('detFeedback').textContent='';$('detFeedback').className='feedback';choices.forEach(c=>{const b=document.createElement('button');b.className='wordbtn';b.textContent=c.text;b.onclick=()=>{document.querySelectorAll('#detGrid .wordbtn').forEach(z=>z.disabled=true);if(c.bad){b.classList.add('correct');mark(detTarget,'known');$('detFeedback').textContent=`答對：${c.text} → ${detTarget.front}`;$('detFeedback').className='feedback ok'}else{b.classList.add('wrong');mark(detTarget,'missed');$('detFeedback').textContent=`這個字本身沒錯；真正拼錯的是 ${choices.find(q=>q.bad).text}，正確應為 ${detTarget.front}`;$('detFeedback').className='feedback no'}};$('detGrid').appendChild(b)})}
$('detScope').onchange=newDetect;$('detNextTop').onclick=newDetect;
let spellX=null,spellDone=false;function newSpell(){if(!all.length)return;let base=filtered($('spellScope')?.value||'all');if(!base.length)base=[...all];spellX=rnd(base);spellDone=false;$('spellMeaning').textContent=spellX.back;$('spellInput').value='';$('spellInput').disabled=false;$('spellSubmit').disabled=false;$('spellFeedback').textContent='';$('spellFeedback').className='feedback';$('spellNext').classList.add('hidden');setTimeout(()=>$('spellInput').focus(),30)}function submitSpell(){if(spellDone||!spellX)return;let v=$('spellInput').value.trim();if(!v)return;spellDone=true;let ok=v.toLowerCase()===spellX.front.toLowerCase();$('spellInput').disabled=true;$('spellSubmit').disabled=true;$('spellNext').classList.remove('hidden');if(ok){mark(spellX,'known');$('spellFeedback').textContent=`完全正確：${spellX.front}`;$('spellFeedback').className='feedback ok'}else{mark(spellX,'missed');$('spellFeedback').textContent=`拼字錯誤。你輸入：${v}；正確：${spellX.front}`;$('spellFeedback').className='feedback no'}}$('spellSubmit').onclick=submitSpell;$('spellNext').onclick=newSpell;$('spellNextTop').onclick=newSpell;$('spellScope').onchange=newSpell;$('spellInput').addEventListener('keydown',e=>{if(e.key==='Enter'){if(spellDone)newSpell();else submitSpell()}});
const CLOZE=[
{bank:['significant','assessment','substantial','explicit','prevalent','particular','variable','conventional'],qs:[['The results showed a ______ difference between the two experimental groups.','significant'],['The questionnaire was used for the ______ of students’ learning outcomes.','assessment'],['A ______ amount of data was collected during the experiment.','substantial'],['The instructions should be sufficiently ______ so that students understand the task.','explicit'],['Online learning has become increasingly ______ in higher education.','prevalent']]},
{bank:['hypothesis','reduce','insight','limitations','encompass','assumption','evidence','pedagogical'],qs:[['Before analyzing the data, the researchers proposed a ______ about the expected relationship.','hypothesis'],['The interface was redesigned to ______ unnecessary cognitive load.','reduce'],['Peer feedback may provide useful ______ into how students understand a task.','insight'],['The authors discussed several ______ of the current study.','limitations'],['The platform can ______ multiple learning tools within one environment.','encompass']]},
{bank:['concentrate','manipulate','distribute','evidence','pedagogical','ignore','maintain','acquisition'],qs:[['Students were asked to ______ on the learning task without opening unrelated websites.','concentrate'],['Researchers may ______ one variable while keeping other conditions stable.','manipulate'],['The instructor will ______ the questionnaire after the activity.','distribute'],['The findings provide ______ that the intervention affected learning behavior.','evidence'],['The design decision was based on a ______ consideration rather than visual preference alone.','pedagogical']]},
{bank:['former','latter','implicit','explicit','temporary','permanent','major','minor'],qs:[['Of the two approaches, the ______ emphasizes rules, whereas the second emphasizes examples.','former'],['Of the two approaches, the first emphasizes rules, whereas the ______ emphasizes examples.','latter'],['Some expectations are not directly stated but remain ______ in the instructions.','implicit'],['The consent form gives ______ information about how participant data will be used.','explicit'],['The pilot system was only a ______ solution used during the initial trial.','temporary']]}
];let currentSet=null;function newCloze(){currentSet=rnd(CLOZE);$('wordBank').innerHTML=currentSet.bank.map(w=>`<span>${w}</span>`).join('');$('clozeList').innerHTML='';currentSet.qs.forEach((q,i)=>{const d=document.createElement('div');d.className='cloze-item';d.innerHTML=`<div><b>${i+1}.</b> ${q[0]}</div><select class="control"><option value="">— 選擇答案 —</option>${currentSet.bank.map(w=>`<option value="${w}">${w}</option>`).join('')}</select><div class="muted ansline"></div>`;$('clozeList').appendChild(d)});$('clozeResult').classList.add('hidden');$('clozeResult').innerHTML=''}function submitCloze(){let right=0;document.querySelectorAll('.cloze-item').forEach((d,i)=>{let v=d.querySelector('select').value,a=currentSet.qs[i][1],line=d.querySelector('.ansline');if(v===a){right++;line.textContent='✓ 正確'}else line.textContent=`✗ 正確答案：${a}`});$('clozeResult').classList.remove('hidden');$('clozeResult').innerHTML=`本組答對 <b>${right} / ${currentSet.qs.length}</b>。這類題目有多餘選項，必須同時判斷語意、搭配與詞性。`} $('newCloze').onclick=newCloze;$('submitCloze').onclick=submitCloze;
load().catch(e=>{document.querySelectorAll('.big').forEach(x=>x.textContent='資料載入失敗');console.error(e)});
</script></body></html>
