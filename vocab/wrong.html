<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>學術英文｜錯題練習</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#64748b;--line:#e2e8f0;--primary:#315efb;--good:#0f9d67;--bad:#d94a4a;--warn:#b7791f}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(180deg,#eef3ff,#f8fafc 40%,#f5f7fb);color:var(--text);min-height:100vh}.wrap{width:min(920px,calc(100% - 24px));margin:auto;padding:24px 0 48px}h1{margin:0;font-size:clamp(28px,5vw,42px)}.sub{color:var(--muted);margin:8px 0 18px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}.control,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}.btn{cursor:pointer}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 18px 48px rgba(30,41,59,.1)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.stat{text-align:center;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}.qtype{display:inline-block;font-size:12px;color:#315efb;background:#edf2ff;padding:6px 9px;border-radius:999px;margin-bottom:12px}.question{font-size:clamp(24px,5vw,38px);font-weight:760;line-height:1.3;text-align:center;margin:14px 0 18px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px 14px;font:inherit;font-size:18px;cursor:pointer;text-align:left;min-height:58px}.option:hover{background:#f8fafc}.option.correct{border-color:#a7e8ce;background:#ebfbf4;color:#0b7a52}.option.wrong{border-color:#ffc7c7;background:#fff0f0;color:#b13232}.option:disabled{cursor:default}.feedback{margin-top:14px;border-radius:14px;padding:13px 14px;display:none}.feedback.show{display:block}.feedback.good{background:#ebfbf4;color:#0b7a52}.feedback.bad{background:#fff0f0;color:#b13232}.after{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.after button{display:none}.after button.show{display:inline-block}.empty{text-align:center;padding:60px 20px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:24px;margin-bottom:10px}.links{margin-top:16px;display:flex;gap:14px;flex-wrap:wrap}.links a{color:#315efb;text-decoration:none}.small{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.options{grid-template-columns:1fr}.toolbar>*{flex:1 1 45%}}
</style>
</head>
<body>
<div class="wrap">
<h1>錯題練習</h1>
<p class="sub">只抓你曾標記「× 還不會」的單字，隨機練英文→中文、中文→英文、拼字辨識。</p>
<div class="toolbar">
<select id="deckSelect" class="control">
<option value="all">全部錯題</option>
<option value="deck1">第一組錯題</option>
<option value="deck2">第二組錯題</option>
<option value="deck3">同義／反義錯題</option>
</select>
<select id="modeSelect" class="control">
<option value="mixed">混合題型</option>
<option value="en2zh">英文 → 中文</option>
<option value="zh2en">中文 → 英文</option>
<option value="spelling">拼字辨識</option>
</select>
<button id="restartBtn" class="btn primary">重新出題</button>
</div>
<section class="panel">
<div class="stats">
<div class="stat"><b id="wrongCount">0</b><span>目前錯題</span></div>
<div class="stat"><b id="answered">0</b><span>本次作答</span></div>
<div class="stat"><b id="correct">0</b><span>答對</span></div>
<div class="stat"><b id="accuracy">0%</b><span>正確率</span></div>
</div>
<div id="quizArea">
<div class="qtype" id="qtype"></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<div class="after">
<button id="nextBtn" class="btn primary">下一題</button>
<button id="markKnownBtn" class="btn">✓ 這個我會了，移出錯題</button>
<button id="speakBtn" class="btn">🔊 念英文</button>
</div>
</div>
<div id="emptyArea" class="empty" style="display:none"><strong>目前沒有錯題</strong>先回單字卡，把不熟的字標記成「× 還不會」，這裡就會自動出題。</div>
<div class="small">錯題資料直接讀取你原本的瀏覽器紀錄；標成會了後會從錯題池移除。</div>
</section>
<div class="links"><a href="./">← 一般單字卡</a><a href="./review.html">篩選複習</a></div>
</div>
<script>
let DATA=null,pool=[],current=null,answered=false,sessionAnswered=0,sessionCorrect=0;
const $=id=>document.getElementById(id);const key=d=>`vocab-progress-${d}`;
const progress=d=>JSON.parse(localStorage.getItem(key(d))||'{}');
const save=(d,p)=>localStorage.setItem(key(d),JSON.stringify(p));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function extractEnglish(text){const m=(text||'').match(/[A-Za-z]+(?:[ -][A-Za-z]+)*/);return m?m[0]:''}
async function loadData(){const html=await fetch('./index.html',{cache:'no-store'}).then(r=>r.text());const m=html.match(/const DATA = (\{[\s\S]*?\});\s*let currentDeck/);if(!m)throw new Error('找不到單字資料');DATA=JSON.parse(m[1]);rebuildPool();nextQuestion()}
function rebuildPool(){const sel=$('deckSelect').value;pool=[];['deck1','deck2','deck3'].forEach(deck=>{if(sel!=='all'&&sel!==deck)return;const p=progress(deck);DATA[deck].forEach((card,index)=>{if(p[index]==='missed')pool.push({deck,index,card})})});$('wrongCount').textContent=pool.length;toggleEmpty()}
function toggleEmpty(){const empty=pool.length===0;$('quizArea').style.display=empty?'none':'block';$('emptyArea').style.display=empty?'block':'none'}
function allCardsFor(deck){return DATA[deck]||[]}
function uniqueOptions(correct,cands){const out=[correct];for(const x of shuffle(cands)){if(out.length>=4)break;if(x&&x!==correct&&!out.includes(x))out.push(x)}while(out.length<4){out.push(correct+' ')}return shuffle(out)}
function mutateWord(word){const clean=word.replace(/[^A-Za-z]/g,'');if(clean.length<4)return word+'s';const variants=new Set();let tries=0;while(variants.size<3&&tries<50){tries++;let a=clean.split('');const t=Math.floor(Math.random()*4);if(t===0&&a.length>3){const i=Math.floor(Math.random()*(a.length-1));[a[i],a[i+1]]=[a[i+1],a[i]]}else if(t===1&&a.length>3){a.splice(Math.floor(Math.random()*a.length),1)}else if(t===2){const i=Math.floor(Math.random()*a.length);a[i]='abcdefghijklmnopqrstuvwxyz'[Math.floor(Math.random()*26)]}else{const i=Math.floor(Math.random()*a.length);a.splice(i,0,a[i])}const v=a.join('');if(v.toLowerCase()!==clean.toLowerCase())variants.add(v)}return [...variants]}
function chooseType(item){let mode=$('modeSelect').value;if(mode!=='mixed')return mode;if(item.deck==='deck3')return Math.random()<.5?'en2zh':'zh2en';const arr=['en2zh','zh2en','spelling'];return arr[Math.floor(Math.random()*arr.length)]}
function buildQuestion(item){const type=chooseType(item),c=item.card;let question,correct,opts,label;
if(item.deck==='deck3'){
  if(type==='zh2en'){question=c.back;correct=c.front;opts=uniqueOptions(correct,allCardsFor('deck3').map(x=>x.front));label='答案 → 題目辨識'}
  else{question=c.front;correct=c.back;opts=uniqueOptions(correct,allCardsFor('deck3').map(x=>x.back));label='同義／反義辨識'}
}else if(type==='en2zh'){
  question=c.front;correct=c.back;opts=uniqueOptions(correct,allCardsFor(item.deck).map(x=>x.back));label='英文 → 中文'}
else if(type==='zh2en'){
  question=c.back;correct=c.front;opts=uniqueOptions(correct,allCardsFor(item.deck).map(x=>x.front));label='中文 → 英文'}
else{
  question=`「${c.back}」的正確拼字是？`;correct=c.front;opts=shuffle([correct,...mutateWord(correct)]).slice(0,4);while(opts.length<4)opts.push(...uniqueOptions(correct,allCardsFor(item.deck).map(x=>x.front)).filter(x=>!opts.includes(x)).slice(0,4-opts.length));label='拼字辨識'}
return{...item,type,question,correct,opts,label}}
function nextQuestion(){rebuildPool();if(!pool.length)return;answered=false;current=buildQuestion(pool[Math.floor(Math.random()*pool.length)]);$('qtype').textContent=current.label;$('question').textContent=current.question;$('feedback').className='feedback';$('feedback').textContent='';$('nextBtn').classList.remove('show');$('markKnownBtn').classList.remove('show');$('speakBtn').classList.add('show');const box=$('options');box.innerHTML='';current.opts.forEach(opt=>{const b=document.createElement('button');b.className='option';b.textContent=opt;b.onclick=()=>answer(opt,b);box.appendChild(b)})}
function answer(opt,btn){if(answered)return;answered=true;sessionAnswered++;const ok=opt===current.correct;if(ok)sessionCorrect++;[...$('options').children].forEach(b=>{b.disabled=true;if(b.textContent===current.correct)b.classList.add('correct')});if(!ok)btn.classList.add('wrong');$('feedback').textContent=ok?'答對。你可以直接下一題，或把這個字標成「會了」移出錯題。':`答錯。正確答案：${current.correct}`;$('feedback').className='feedback show '+(ok?'good':'bad');$('nextBtn').classList.add('show');if(ok)$('markKnownBtn').classList.add('show');updateStats()}
function updateStats(){$('answered').textContent=sessionAnswered;$('correct').textContent=sessionCorrect;$('accuracy').textContent=sessionAnswered?Math.round(sessionCorrect/sessionAnswered*100)+'%':'0%'}
function markKnown(){if(!current)return;const p=progress(current.deck);p[current.index]='known';save(current.deck,p);rebuildPool();nextQuestion()}
function speak(){if(!current)return;let text=current.card.front;if(current.deck==='deck3'){text=extractEnglish(current.card.front)||extractEnglish(current.card.back)}if(!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}
$('nextBtn').onclick=nextQuestion;$('markKnownBtn').onclick=markKnown;$('speakBtn').onclick=speak;$('restartBtn').onclick=()=>{sessionAnswered=0;sessionCorrect=0;updateStats();rebuildPool();nextQuestion()};$('deckSelect').onchange=()=>{rebuildPool();nextQuestion()};$('modeSelect').onchange=nextQuestion;
loadData().catch(e=>{$('quizArea').innerHTML='<div class="empty"><strong>資料載入失敗</strong>'+e.message+'</div>'})
</script>
</body>
</html>
